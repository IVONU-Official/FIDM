[package]
name = "fidm"
version = "0.1.0"
edition = "2024"
description = "A cross-platform download manager built with Rust"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
